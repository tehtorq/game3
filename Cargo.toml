[package]
name = "vector_shooter"
version = "0.1.0"
edition = "2021"
default-run = "vector_shooter"

[features]
default = []
audio = ["rodio"]

[dependencies]
miniquad = "0.4"
glam = { version = "0.24", features = ["mint"] }
rand = "0.8"
clap = { version = "4.4", features = ["derive"] }
image = "0.24"
rodio = { version = "0.19", optional = true }
lazy_static = "1.4"

